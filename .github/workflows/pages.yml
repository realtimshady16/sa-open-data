name: Publish the static view

# Builds site/ from datasets/ and publishes it. site/ stays git-ignored on purpose: the site is
# a view of the data, not part of the record (see README, "The static view"). Rebuilding on
# every push keeps the published bytes reproducible with one command and no network.

on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "tools/build_site.py"
      - "tools/test_site_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_site.py is standard library only: no requirements file, no pip step, no network.
      - name: Build the site
        run: python3 tools/build_site.py

      # Independent of the generator's own latest-period rule: catches a view that drifts
      # from the raw capture even when index and detail pages agree with each other.
      - name: Check the view against the raw capture
        run: python3 -m unittest tools/test_site_data.py -v

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
